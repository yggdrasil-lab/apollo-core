name: Deploy to Gaia

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, gaia]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Secrets
        env:
          METUBE_COOKIES_TXT: ${{ secrets.METUBE_COOKIES_TXT }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/yggdrasil-lab/yggdrasil-os/main/deploy/ensure_secret.sh -o /tmp/ensure_secret.sh
          chmod +x /tmp/ensure_secret.sh
          # Generate versioned secret for MeTube Cookies
          echo "METUBE_COOKIES_SECRET_NAME=$(echo "$METUBE_COOKIES_TXT" | /tmp/ensure_secret.sh apollo_metube_cookies)" >> $GITHUB_ENV

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: registry.tienzo.net
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_RAW_PASSWORD }}

      - name: Deploy Stack
        env:
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          LDAP_SERVER: ${{ secrets.LDAP_SERVER || vars.LDAP_SERVER }}
          LDAP_PORT: ${{ secrets.LDAP_PORT || vars.LDAP_PORT }}
          LDAP_BIND_USER: ${{ secrets.LDAP_BIND_USER || vars.LDAP_BIND_USER }}
          LDAP_BIND_PASSWORD: ${{ secrets.LDAP_BIND_PASSWORD || secrets.LDAP_USER_PASS || secrets.AUTHENTIK_LDAP_USER_PASS }}
          LDAP_BASE_DN: ${{ secrets.LDAP_BASE_DN || vars.LDAP_BASE_DN }}
          LDAP_JELLYFIN_USERS_GROUP: ${{ secrets.LDAP_JELLYFIN_USERS_GROUP || vars.LDAP_JELLYFIN_USERS_GROUP }}
          LDAP_JELLYFIN_ADMINS_GROUP: ${{ secrets.LDAP_JELLYFIN_ADMINS_GROUP || vars.LDAP_JELLYFIN_ADMINS_GROUP }}
          JELLYSTAT_JWT_SECRET: ${{ secrets.JELLYSTAT_JWT_SECRET }}
          REGISTRY_PREFIX: ${{ vars.REGISTRY_PREFIX }}
          RADARR_API_KEY: ${{ secrets.RADARR_API_KEY }}
          SONARR_API_KEY: ${{ secrets.SONARR_API_KEY }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/yggdrasil-lab/yggdrasil-os/main/deploy/deploy.sh -o /tmp/deploy.sh
          chmod +x /tmp/deploy.sh
          /tmp/deploy.sh "apollo-core" docker-compose.yml
